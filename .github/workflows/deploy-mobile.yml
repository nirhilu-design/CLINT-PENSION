name: Deploy mobile preview to Cloudflare

# Deploys the mobile-first branch to a SEPARATE Cloudflare Worker
# (clint-pension-mobile) so it can be viewed without touching the main site.
on:
  push:
    branches: [claude/mobile-first-mvp]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare secrets are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is MISSING. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is MISSING. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Deploy to a separate Worker (clint-pension-mobile)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name clint-pension-mobile
